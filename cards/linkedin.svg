<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="273" height="92" viewBox="0 0 273 92" role="img" aria-label="LinkedIn">
  <title>LinkedIn</title>
  <style>
    @font-face{font-family:Card;src:url(data:font/woff;base64,) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Card;src:url(data:font/woff;base64,) format("woff");font-weight:700;font-display:swap}
    text { font-family:Card,"Times New Roman",serif; }
          .panel-content { animation: entrance .55s cubic-bezier(.18,.75,.25,1) 0.34s both; }
          .bars { transform-box:fill-box; transform-origin:center bottom;
                   animation: rise .66s ease-out 0.50s both; }
          @keyframes entrance { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
          @keyframes rise { from { transform:scaleY(.03); } to { transform:scaleY(1); } }
          @media (prefers-reduced-motion: reduce) {
            .panel-content,.bars,.solar-glow,.solar-orbit,.solar-surface { animation:none; }
            .flash { display:none; }
          }
  </style>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#233db6"/></pattern>
  </defs>
  <rect x="5" y="5" width="266" height="85" rx="15" fill="#141a32" />
  <rect x="2" y="2" width="265" height="84" rx="14" fill="#fffdf6" stroke="#141a32" stroke-width="2"/>
  <g class="panel-content"><rect x="15" y="20" width="46" height="48" rx="8" fill="#233db6" /><text x="38" y="51" font-size="22" fill="#fffdf6" text-anchor="middle" font-weight="700">in</text><text x="73" y="41" font-size="24" fill="#141a32" text-anchor="start" font-weight="700">LinkedIn</text><text x="73" y="64" font-size="16" fill="#47516d" text-anchor="start">Connect with me</text><path d="M224 50l17 -17m-12 0h12v12" fill="none" stroke="#233db6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="flash" opacity="0"><path d="M18 10H251" stroke="#738bff" stroke-width="3"/><animate attributeName="opacity" values="0;.8;0" begin="0.34s" dur=".62s" fill="remove"/></g>
</svg>
