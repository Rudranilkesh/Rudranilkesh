<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="840" height="122" viewBox="0 0 840 122" role="img" aria-label="SocialSync AI">
  <title>SocialSync AI</title>
  <style>
    @font-face{font-family:Card;src:url(data:font/woff;base64,) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Card;src:url(data:font/woff;base64,) format("woff");font-weight:700;font-display:swap}
    text { font-family:Card,"Times New Roman",serif; }
          .panel-content { animation: entrance .55s cubic-bezier(.18,.75,.25,1) 1.21s both; }
          .bars { transform-box:fill-box; transform-origin:center bottom;
                   animation: rise .66s ease-out 1.37s both; }
          @keyframes entrance { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
          @keyframes rise { from { transform:scaleY(.03); } to { transform:scaleY(1); } }
          @media (prefers-reduced-motion: reduce) {
            .panel-content,.bars,.solar-glow,.solar-orbit,.solar-surface { animation:none; }
            .flash { display:none; }
          }
  </style>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#233db6"/></pattern>
  </defs>
  <rect x="5" y="5" width="833" height="115" rx="15" fill="#141a32" />
  <rect x="2" y="2" width="832" height="114" rx="14" fill="#fffdf6" stroke="#141a32" stroke-width="2"/>
  <g class="panel-content"><rect x="22" y="21" width="66" height="77" rx="10" fill="#e9ecfa" /><path d="M44 43h20v30H44zm5 7h10m-10 6h10m-10 6h6" fill="none" stroke="#233db6" stroke-width="2"/><text x="107" y="44" font-size="27" fill="#141a32" text-anchor="start" font-weight="700">SocialSync AI</text><text x="108" y="70" font-size="19" fill="#47516d" text-anchor="start">Generate captions, connect social accounts, and schedule posts.</text><text x="108" y="94" font-size="16" fill="#233db6" text-anchor="start" font-weight="700">React · Express · MongoDB · Gemini</text><path d="M782 50l17 -17m-12 0h12v12" fill="none" stroke="#233db6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="flash" opacity="0"><path d="M18 10H818" stroke="#738bff" stroke-width="3"/><animate attributeName="opacity" values="0;.8;0" begin="1.21s" dur=".62s" fill="remove"/></g>
</svg>
