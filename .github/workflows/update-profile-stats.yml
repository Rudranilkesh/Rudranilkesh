name: Update Profile Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - ".github/workflows/update-profile-stats.yml"
      - "render_cards.py"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install FontTools
        run: python -m pip install fonttools==4.68.0

      - name: Refresh the contribution snapshot and render SVG cards
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python render_cards.py --refresh "$PROFILE_OWNER"

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/*.svg
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: refresh profile cards"
          git push
